# Alembic config. The database URL is not stored here: env.py reads MIGRATION_DATABASE_URL,
# then DATABASE_URL (same as the app), or `alembic -x url=... upgrade head`.
#
#   alembic upgrade head                      # migrate the configured database
#   alembic revision --autogenerate -m "..."  # new revision from model changes
#   alembic -x url="mssql+pyodbc://u:p@host/kasa?driver=ODBC+Driver+18+for+SQL+Server" upgrade head --sql
#                                             # print the SQL Server DDL without connecting

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
